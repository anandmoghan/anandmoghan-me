# Cloudflare Pages configuration
name = "anandmoghan-me"
compatibility_date = "2024-01-01"

# Pages-specific configuration
pages_build_output_dir = "out"

# Build configuration
[build]
command = "npm run build"
cwd = "."

# Environment variables for build
[build.environment]
NODE_VERSION = "20"
NPM_VERSION = "10"

# Production environment variables
[env.production]
NEXT_PUBLIC_MEDIA_URL = "https://media.anandmoghan.me"
NEXT_PUBLIC_CDN_OPTIMIZE = "true"

# Preview/staging environment variables
[env.preview]
NEXT_PUBLIC_MEDIA_URL = "https://media-staging.anandmoghan.me"
NEXT_PUBLIC_CDN_OPTIMIZE = "false"

# R2 bucket bindings (for future server-side functionality)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "anandmoghan-media"
preview_bucket_name = "anandmoghan-media-preview"
