name: Deploy to Staging

on:
  # Trigger on push to staging branch
  push:
    branches:
      - staging
      - develop
  
  # Allow manual deployment to staging
  workflow_dispatch:

# Prevent concurrent staging deployments
concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        env:
          NEXT_PUBLIC_MEDIA_URL: ${{ secrets.NEXT_PUBLIC_MEDIA_URL_STAGING || 'https://media-staging.anandmoghan.me' }}
          NEXT_PUBLIC_CDN_OPTIMIZE: 'false'
        run: npm run build
      
      - name: Deploy to Cloudflare Pages (Staging)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'anandmoghan-me' }} --branch=staging
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging deployment..."
          
          # Wait for deployment to be ready
          sleep 15
          
          STAGING_URL="${{ steps.deploy.outputs.deployment-url }}"
          
          # Test homepage
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Homepage accessible"
          else
            echo "❌ Homepage failed - HTTP status: $HTTP_STATUS"
            exit 1
          fi
          
          # Test blog page
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/posts")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Blog page accessible"
          else
            echo "❌ Blog page failed - HTTP status: $HTTP_STATUS"
            exit 1
          fi
          
          # Test media page
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/media")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Media page accessible"
          else
            echo "❌ Media page failed - HTTP status: $HTTP_STATUS"
            exit 1
          fi
          
          echo "✅ All smoke tests passed"
      
      - name: Create deployment summary
        run: |
          echo "## 🧪 Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Homepage" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Blog page" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Media page" >> $GITHUB_STEP_SUMMARY
