name: Health Check

on:
  # Run health checks every hour
  schedule:
    - cron: '0 * * * *'
  
  # Allow manual health check
  workflow_dispatch:
  
  # Run after deployments
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages"]
    types:
      - completed

jobs:
  health-check:
    name: Check Site Health
    runs-on: ubuntu-latest
    
    steps:
      - name: Check production site
        id: prod_check
        run: |
          echo "Checking production site..."
          
          # Check homepage
          HOMEPAGE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://anandmoghan.me)
          echo "homepage_status=$HOMEPAGE_STATUS" >> $GITHUB_OUTPUT
          
          # Check blog
          BLOG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://anandmoghan.me/posts)
          echo "blog_status=$BLOG_STATUS" >> $GITHUB_OUTPUT
          
          # Check media page
          MEDIA_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://anandmoghan.me/media)
          echo "media_status=$MEDIA_STATUS" >> $GITHUB_OUTPUT
          
          # Check profile
          PROFILE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://anandmoghan.me/profile)
          echo "profile_status=$PROFILE_STATUS" >> $GITHUB_OUTPUT
          
          # Check sitemap
          SITEMAP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://anandmoghan.me/sitemap.xml)
          echo "sitemap_status=$SITEMAP_STATUS" >> $GITHUB_OUTPUT
          
          # Check robots.txt
          ROBOTS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://anandmoghan.me/robots.txt)
          echo "robots_status=$ROBOTS_STATUS" >> $GITHUB_OUTPUT
      
      - name: Check response times
        id: perf_check
        run: |
          echo "Checking response times..."
          
          # Measure homepage response time
          HOMEPAGE_TIME=$(curl -s -o /dev/null -w "%{time_total}" https://anandmoghan.me)
          echo "homepage_time=$HOMEPAGE_TIME" >> $GITHUB_OUTPUT
          
          # Measure blog response time
          BLOG_TIME=$(curl -s -o /dev/null -w "%{time_total}" https://anandmoghan.me/posts)
          echo "blog_time=$BLOG_TIME" >> $GITHUB_OUTPUT
          
          echo "Homepage response time: ${HOMEPAGE_TIME}s"
          echo "Blog response time: ${BLOG_TIME}s"
      
      - name: Check SSL certificate
        id: ssl_check
        run: |
          echo "Checking SSL certificate..."
          
          # Get certificate expiry
          CERT_EXPIRY=$(echo | openssl s_client -servername anandmoghan.me -connect anandmoghan.me:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          echo "cert_expiry=$CERT_EXPIRY" >> $GITHUB_OUTPUT
          
          # Calculate days until expiry
          EXPIRY_EPOCH=$(date -d "$CERT_EXPIRY" +%s)
          CURRENT_EPOCH=$(date +%s)
          DAYS_UNTIL_EXPIRY=$(( ($EXPIRY_EPOCH - $CURRENT_EPOCH) / 86400 ))
          echo "days_until_expiry=$DAYS_UNTIL_EXPIRY" >> $GITHUB_OUTPUT
          
          echo "Certificate expires: $CERT_EXPIRY"
          echo "Days until expiry: $DAYS_UNTIL_EXPIRY"
      
      - name: Evaluate health status
        id: evaluate
        run: |
          HEALTH_STATUS="healthy"
          ISSUES=()
          
          # Check HTTP status codes
          if [ "${{ steps.prod_check.outputs.homepage_status }}" != "200" ]; then
            HEALTH_STATUS="unhealthy"
            ISSUES+=("Homepage returned ${{ steps.prod_check.outputs.homepage_status }}")
          fi
          
          if [ "${{ steps.prod_check.outputs.blog_status }}" != "200" ]; then
            HEALTH_STATUS="unhealthy"
            ISSUES+=("Blog returned ${{ steps.prod_check.outputs.blog_status }}")
          fi
          
          if [ "${{ steps.prod_check.outputs.media_status }}" != "200" ]; then
            HEALTH_STATUS="unhealthy"
            ISSUES+=("Media page returned ${{ steps.prod_check.outputs.media_status }}")
          fi
          
          if [ "${{ steps.prod_check.outputs.profile_status }}" != "200" ]; then
            HEALTH_STATUS="unhealthy"
            ISSUES+=("Profile returned ${{ steps.prod_check.outputs.profile_status }}")
          fi
          
          # Check response times (warn if > 2 seconds)
          HOMEPAGE_TIME_MS=$(echo "${{ steps.perf_check.outputs.homepage_time }} * 1000" | bc | cut -d. -f1)
          if [ "$HOMEPAGE_TIME_MS" -gt 2000 ]; then
            HEALTH_STATUS="degraded"
            ISSUES+=("Homepage response time: ${{ steps.perf_check.outputs.homepage_time }}s (> 2s)")
          fi
          
          # Check SSL certificate (warn if < 30 days)
          if [ "${{ steps.ssl_check.outputs.days_until_expiry }}" -lt 30 ]; then
            HEALTH_STATUS="warning"
            ISSUES+=("SSL certificate expires in ${{ steps.ssl_check.outputs.days_until_expiry }} days")
          fi
          
          echo "health_status=$HEALTH_STATUS" >> $GITHUB_OUTPUT
          
          # Save issues to file
          printf '%s\n' "${ISSUES[@]}" > issues.txt || echo "" > issues.txt
      
      - name: Create health report
        run: |
          if [ "${{ steps.evaluate.outputs.health_status }}" = "healthy" ]; then
            echo "## ✅ Site Health: Healthy" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.evaluate.outputs.health_status }}" = "degraded" ]; then
            echo "## ⚠️ Site Health: Degraded" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.evaluate.outputs.health_status }}" = "warning" ]; then
            echo "## ⚠️ Site Health: Warning" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Site Health: Unhealthy" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status Checks" >> $GITHUB_STEP_SUMMARY
          echo "- Homepage: ${{ steps.prod_check.outputs.homepage_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Blog: ${{ steps.prod_check.outputs.blog_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Media: ${{ steps.prod_check.outputs.media_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Profile: ${{ steps.prod_check.outputs.profile_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sitemap: ${{ steps.prod_check.outputs.sitemap_status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Robots.txt: ${{ steps.prod_check.outputs.robots_status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Performance" >> $GITHUB_STEP_SUMMARY
          echo "- Homepage response time: ${{ steps.perf_check.outputs.homepage_time }}s" >> $GITHUB_STEP_SUMMARY
          echo "- Blog response time: ${{ steps.perf_check.outputs.blog_time }}s" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SSL Certificate" >> $GITHUB_STEP_SUMMARY
          echo "- Expires: ${{ steps.ssl_check.outputs.cert_expiry }}" >> $GITHUB_STEP_SUMMARY
          echo "- Days until expiry: ${{ steps.ssl_check.outputs.days_until_expiry }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -s issues.txt ]; then
            echo "### Issues Detected" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r issue; do
              echo "- ⚠️ $issue" >> $GITHUB_STEP_SUMMARY
            done < issues.txt
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Check time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
      
      - name: Fail on unhealthy status
        if: steps.evaluate.outputs.health_status == 'unhealthy'
        run: |
          echo "❌ Site health check failed"
          exit 1
