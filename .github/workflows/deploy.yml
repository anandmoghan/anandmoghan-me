name: Deploy to Firebase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Preview channel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Dependabot PRs get no secrets, so they build but do not deploy a channel.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.actor != 'dependabot[bot]'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: anandmoghan-me
          expires: 7d

  production:
    name: Production deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Build site
        run: npm run build

      # The key comes in through env, never pasted into the script text. The
      # check reports which account CI deploys as (email only), so a missing or
      # malformed secret fails here with a readable annotation.
      - name: Write service account
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          node -e '
            const fs = require("fs");
            let key;
            try { key = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch { console.log("::error title=Service account::FIREBASE_SERVICE_ACCOUNT is missing or not JSON"); process.exit(1); }
            if (key.type !== "service_account" || !key.client_email || !key.private_key) {
              console.log("::error title=Service account::FIREBASE_SERVICE_ACCOUNT is not a service-account key"); process.exit(1);
            }
            console.log(`::notice title=Service account::deploying as ${key.client_email} (project ${key.project_id})`);
          ' "$RUNNER_TEMP/sa.json"

      # Functions (the Trading212 api) stay off until ENCRYPTION_SECRET is set;
      # set the repository variable DEPLOY_FUNCTIONS=true to include them.
      # On failure the Firebase error lines become annotations, which the
      # run summary shows without opening the log.
      - name: Deploy hosting and rules (and functions when enabled)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          TARGETS: ${{ vars.DEPLOY_FUNCTIONS == 'true' && 'hosting,functions,firestore,storage' || 'hosting,firestore,storage' }}
        run: |
          set -o pipefail
          if ! npx firebase deploy --project anandmoghan-me --only "$TARGETS" --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            grep -iE 'error|denied|permission|forbidden|not enabled|unauthor|invalid' "$RUNNER_TEMP/deploy.log" \
              | tail -n 15 | sed 's/^/::error title=Firebase deploy::/'
            exit 1
          fi
