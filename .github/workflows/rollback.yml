name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - production
          - staging
      deployment_id:
        description: 'Deployment ID to rollback to (leave empty for previous deployment)'
        required: false
        type: string
      reason:
        description: 'Reason for rollback'
        required: true
        type: string

jobs:
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Validate rollback request
        run: |
          echo "## 🔄 Rollback Request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Requested by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason**: ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Get target deployment
        id: target
        run: |
          BRANCH="${{ github.event.inputs.environment == 'production' && 'main' || 'staging' }}"
          
          if [ -n "${{ github.event.inputs.deployment_id }}" ]; then
            # Use specified deployment ID
            TARGET_DEPLOYMENT="${{ github.event.inputs.deployment_id }}"
            echo "Using specified deployment: $TARGET_DEPLOYMENT"
          else
            # Get the previous successful deployment
            DEPLOYMENTS=$(curl -s -X GET \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ secrets.CLOUDFLARE_PROJECT_NAME || 'anandmoghan-me' }}/deployments" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json")
            
            TARGET_DEPLOYMENT=$(echo "$DEPLOYMENTS" | jq -r ".result[] | select(.deployment_trigger.metadata.branch == \"$BRANCH\" and .latest_stage.status == \"success\") | .id" | head -n 2 | tail -n 1)
            
            if [ -z "$TARGET_DEPLOYMENT" ]; then
              echo "❌ No previous successful deployment found"
              exit 1
            fi
            
            echo "Found previous deployment: $TARGET_DEPLOYMENT"
          fi
          
          echo "target_deployment=$TARGET_DEPLOYMENT" >> $GITHUB_OUTPUT
      
      - name: Get deployment details
        id: details
        run: |
          DEPLOYMENT_INFO=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ secrets.CLOUDFLARE_PROJECT_NAME || 'anandmoghan-me' }}/deployments/${{ steps.target.outputs.target_deployment }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          
          COMMIT_HASH=$(echo "$DEPLOYMENT_INFO" | jq -r '.result.deployment_trigger.metadata.commit_hash')
          CREATED_ON=$(echo "$DEPLOYMENT_INFO" | jq -r '.result.created_on')
          
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "created_on=$CREATED_ON" >> $GITHUB_OUTPUT
          
          echo "Target deployment details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID**: ${{ steps.target.outputs.target_deployment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: $COMMIT_HASH" >> $GITHUB_STEP_SUMMARY
          echo "- **Created**: $CREATED_ON" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Confirm rollback
        run: |
          echo "⚠️ Rolling back to deployment ${{ steps.target.outputs.target_deployment }}"
          echo "This will revert the ${{ github.event.inputs.environment }} environment to commit ${{ steps.details.outputs.commit_hash }}"
      
      - name: Execute rollback
        id: rollback
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ secrets.CLOUDFLARE_PROJECT_NAME || 'anandmoghan-me' }}/deployments/${{ steps.target.outputs.target_deployment }}/rollback" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ Rollback successful"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Rollback failed"
            echo "$RESPONSE" | jq '.'
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Verify rollback
        if: steps.rollback.outputs.success == 'true'
        run: |
          echo "Waiting for rollback to complete..."
          sleep 20
          
          # Verify the site is accessible
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            URL="https://anandmoghan.me"
          else
            URL="https://staging.anandmoghan.me"
          fi
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Site is accessible after rollback"
          else
            echo "⚠️ Site returned HTTP status: $HTTP_STATUS"
          fi
      
      - name: Create rollback summary
        if: always()
        run: |
          if [ "${{ steps.rollback.outputs.success }}" = "true" ]; then
            echo "## ✅ Rollback Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Rollback Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Deployment**: ${{ steps.target.outputs.target_deployment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Commit**: ${{ steps.details.outputs.commit_hash }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason**: ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Executed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
      
      - name: Notify team
        if: always()
        run: |
          if [ "${{ steps.rollback.outputs.success }}" = "true" ]; then
            echo "✅ Rollback completed successfully"
            echo "Environment: ${{ github.event.inputs.environment }}"
            echo "Reason: ${{ github.event.inputs.reason }}"
          else
            echo "❌ Rollback failed - manual intervention required"
          fi
