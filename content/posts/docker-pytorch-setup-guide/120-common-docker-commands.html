<section id="common-docker-commands">
  <h2>Common Docker Commands</h2>
  <p>Here are essential Docker commands you'll use frequently:</p>
  <pre><code class="language-bash">docker ps
docker ps -a
docker images
docker rm &lt;container-id&gt;
docker rmi &lt;image-id&gt;
docker logs &lt;container-id&gt;
docker exec -it &lt;container-id&gt; bash
docker stop &lt;container-id&gt;
docker system prune</code></pre>
</section>
