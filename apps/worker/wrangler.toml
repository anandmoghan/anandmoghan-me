name = "t212-proxy"
main = "trading212-proxy.ts"
compatibility_date = "2024-01-01"

[observability]
enabled = false

[triggers]
crons = ["0 */4 * * *"]  # every 4 hours

[vars]
FIREBASE_PROJECT_ID = "anandmoghan-me"
RATE_LIMIT_PER_MINUTE = 120
# Secrets — set via wrangler secret put <NAME>:
#   SA_EMAIL        — service account client_email
#   SA_PRIVATE_KEY  — service account private_key
#   ENCRYPTION_SECRET — random 32+ char string for T212 credential encryption

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "dd87448afb4846c99e9ebbfbdd006c2d"
