name = "t212-proxy"
main = "trading212-proxy.ts"
compatibility_date = "2024-01-01"

[observability]
enabled = false

[triggers]
crons = ["0 * * * *"]  # every hour on the hour

[vars]
FIREBASE_PROJECT_ID = "anandmoghan-me"
RATE_LIMIT_PER_MINUTE = 120
# SA_PRIVATE_KEY must be set via: wrangler secret put SA_PRIVATE_KEY
# SA_EMAIL must be set via: wrangler secret put SA_EMAIL  (client_email from service account JSON)

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "dd87448afb4846c99e9ebbfbdd006c2d"
